name: sajjad_ali_portfolio
description: Personal portfolio for Sajjad Ali — Senior Full Stack Flutter Developer and Founder of CodeWend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - branding/
    - images/portfolio/asharq-business/
    - images/portfolio/fastwheel/
    - images/portfolio/creademic/
    - images/portfolio/irk/
    - images/portfolio/asharq-now/
    - images/portfolio/chatcash/
    - images/portfolio/chatcash/full-hd/
    - images/portfolio/fastwheel/full-hd/
    - images/portfolio/rewardbee/
    - images/portfolio/asharq-business/preview/
    - images/portfolio/asharq-now/preview/
    - images/portfolio/rewardbee/preview/
    - images/portfolio/irk/preview/
    - images/portfolio/chatcash/preview/
    - images/portfolio/fastwheel/preview/
    - images/portfolio/creademic/preview/
    - images/profile/preview/
    - images/profile/
